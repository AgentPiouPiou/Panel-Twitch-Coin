<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panneau Twitch Mobile</title>
    <style>
        body { 
            background: #0e0e10; 
            color: #efeff1; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        h1 { 
            color: #9146ff; 
            margin-bottom: 25px;
        }
        .card { 
            background: #18181b; 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        h3 {
            margin-top: 0;
            color: #ffffff;
        }
        input[type="text"] { 
            width: 90%; 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 5px; 
            border: 1px solid #303032; 
            background: #0e0e10; 
            color: white; 
            margin-bottom: 15px; 
            text-align: center; 
            box-sizing: border-box;
        }
        button { 
            background: #9146ff; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
        }
        button:hover { 
            background: #772ce8; 
        }
        .btn-danger { 
            background: #eb0400; 
        }
        .btn-danger:hover { 
            background: #b80300; 
        }
    </style>
</head>
<body>
    <h1>Panneau Twitch</h1>
    
    <div class="card">
        <h3>Lancer un live</h3>
        <input type="text" id="channelInput" placeholder="Nom de la chaîne (ex: mastu)">
        <button onclick="lancerLive()">Lancer le live</button>
    </div>

    <div class="card">
        <h3>Contrôle</h3>
        <button class="btn-danger" onclick="fermerLive()">Fermer Firefox / Stop</button>
    </div>

<script>
        const SUPABASE_URL = "https://tldixozxuuutqcgvtqvy.supabase.co/rest/v1/commandes?id=eq.1";
        const SUPABASE_KEY = "sb_publishable_9pPrAO06CE0rgAjrhUzDkg_kCAFd6GB";

        async function lancerLive() {
            let channel = document.getElementById('channelInput').value.trim();
            if (!channel) {
                alert("Entre un nom de chaîne !");
                return;
            }

            try {
                let response = await fetch(SUPABASE_URL, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ action: 'lancer', channel: channel })
                });

                if (response.ok) {
                    alert(`Ordre envoyé : Lancer ${channel} !`);
                } else {
                    // Affiche l'erreur exacte renvoyée par Supabase dans la console
                    let errorText = await response.text();
                    console.error("Erreur Supabase :", errorText);
                    alert("Erreur lors de l'envoi. Regarde la console (F12) pour les détails.");
                }
            } catch (error) {
                console.error("Erreur réseau:", error);
                alert("Impossible de joindre l'API.");
            }
        }

        async function fermerLive() {
            try {
                let response = await fetch(SUPABASE_URL, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ action: 'fermer', channel: '' })
                });

                if (response.ok) {
                    alert("Ordre de fermeture envoyé au PC !");
                } else {
                    let errorText = await response.text();
                    console.error("Erreur Supabase :", errorText);
                    alert("Erreur lors de l'envoi. Regarde la console (F12).");
                }
            } catch (error) {
                console.error("Erreur réseau:", error);
            }
        }
    </script>

</body>
</html>
